name: Image VPS
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: image-vps-main
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/baroka-wp/etu-faq
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.vps
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Vérifier le démarrage avant publication
        run: |
          docker run -d --name etufaq -p 127.0.0.1:3000:3000 "$IMAGE:$GITHUB_SHA"
          curl --retry 20 --retry-delay 1 --retry-all-errors --fail http://127.0.0.1:3000/ -o /dev/null
          docker exec etufaq node -e "const {PrismaClient}=require('@prisma/client'); new PrismaClient()"
      - name: Publier la version vérifiée
        run: |
          docker push "$IMAGE:$GITHUB_SHA"
          docker tag "$IMAGE:$GITHUB_SHA" "$IMAGE:latest"
          docker push "$IMAGE:latest"
      - name: Déployer dans Coolify
        env:
          WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -n "$WEBHOOK" ] && [ -n "$TOKEN" ]; then
            curl --silent --show-error --fail --request POST --header "Authorization: Bearer $TOKEN" "$WEBHOOK" -o /dev/null
          fi
